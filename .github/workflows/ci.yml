name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift & macOS Environment
        run: |
          swift --version
          sw_vers
          xcode-select -p

      - name: Run Unit Tests
        run: ./build.sh test

      - name: Build App & DMG
        run: ./package_app.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cepaty-Installer
          path: Cepaty-1.0.0.dmg
          if-no-files-found: error
